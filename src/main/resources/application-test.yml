spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/withgahyo_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${TEST_DB_USERNAME:${DB_USERNAME:root}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${TEST_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: ${TEST_JPA_SHOW_SQL:true}

logging:
  level:
    root: info
    com.withgahyo: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

internal:
  ai:
    api-key: ${INTERNAL_AI_API_KEY:test-internal-ai-key}

auth:
  jwt:
    secret: ${JWT_SECRET:test-secret-for-auth-tests-minimum-32-bytes-long}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:test-kakao-client-id}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:test-google-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:test-google-client-secret}

app:
  r2:
    endpoint: https://example.r2.cloudflarestorage.com
    access-key-id: test-r2-access-key
    secret-access-key: test-r2-secret-key
    bucket: withgahyo-test
    public-base-url: https://images.example.com
