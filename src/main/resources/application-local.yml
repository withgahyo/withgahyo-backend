spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/withgahyo?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:true}
  sql:
    init:
      mode: always
      encoding: UTF-8

logging:
  level:
    root: info
    com.withgahyo: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

auth:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-must-be-changed}
